name: Publish Instagram Reel

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 15 * * *"
      timezone: "Asia/Kolkata"
    - cron: "0 20 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-reel-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate and publish one Reel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_API_HOST: ${{ secrets.INSTAGRAM_API_HOST }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_FOLDER: ${{ secrets.CLOUDINARY_FOLDER }}
          PYTHONUNBUFFERED: "1"
        run: python main.py --publish --limit 1 --strict

      - name: Persist selection and publishing state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for state_file in .video_selection_state.json .quote_history.json .instagram_publish_state.json; do
            if [ -f "$state_file" ]; then
              git add -f "$state_file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist publisher state"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch --prune origin "${GITHUB_REF_NAME}"
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                echo "Could not rebase state commit onto the latest remote branch."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:"${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              echo "State push raced with another remote update; retrying (${attempt}/5)."
              sleep $((attempt * 2))
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not persist publisher state after 5 attempts."
              exit 1
            fi
          fi
